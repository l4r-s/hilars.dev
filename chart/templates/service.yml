---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hilars-dev.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hilars-dev.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
