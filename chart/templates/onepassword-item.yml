{{- if .Values.onepassword }}
---
# A normal resource, not a hook: a hook is deleted and recreated on every sync,
# and deleting the item garbage-collects its Secret. Wave -20 creates it before
# the Deployment (wave 0) that reads the Secret.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ .Values.onepassword | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: {{ printf "vaults/kube/items/%s" .Values.onepassword | quote }}
{{- end }}
