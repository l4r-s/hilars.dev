---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hilars-dev.labels" . | nindent 4 }}
  {{- if .Values.onepassword }}
  annotations:
    operator.1password.io/item-path: {{ printf "vaults/kube/items/%s" .Values.onepassword | quote }}
    operator.1password.io/item-name: {{ .Values.onepassword | quote }}
    operator.1password.io/auto-restart: "true"
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # Start the new pod and wait for it to be ready before stopping the old one,
  # so a rollout (including the first Argo CD sync) never drops the site.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hilars-dev.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hilars-dev.labels" . | nindent 8 }}
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: hilars-dev
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- if .Values.onepassword }}
          envFrom:
            - secretRef:
                name: {{ .Values.onepassword | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
