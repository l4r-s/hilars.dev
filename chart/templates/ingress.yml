---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hilars-dev.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "ingress.certClusterIssuer is required" .Values.ingress.certClusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: {{ .Values.ingress.redirectWww | quote }}
    {{- if .Values.ingress.noindex }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Robots-Tag: noindex, nofollow";
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-node
                port:
                  number: 3000
  tls:
    - hosts:
        {{- if .Values.ingress.redirectWww }}
        - {{ printf "www.%s" .Values.ingress.host | quote }}
        {{- end }}
        - {{ .Values.ingress.host | quote }}
      # Same Secret name as the Helmfile release, so adoption keeps serving the
      # existing certificate while cert-manager renews it.
      secretName: {{ printf "hilars-dev-tls-%s" .Release.Name | quote }}
